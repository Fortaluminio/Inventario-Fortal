<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Inventário Fortal" />
<meta name="theme-color" content="#182642" />
<title>Inventário Fortal</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div id="app">
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#182642;">
    <div style="color:#AFC3E0;font-size:13px;">Carregando…</div>
  </div>
</div>

<script>
  // Vigia independente: se depois de alguns segundos a tela continuar
  // só com "Carregando...", mostra um erro em vez de ficar em branco/mudo.
  setTimeout(function () {
    var app = document.getElementById('app');
    if (app && app.textContent.trim() === 'Carregando…') {
      app.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px;background:#F5F5F7;">' +
        '<div style="text-align:center;max-width:320px;">' +
        '<div style="font-size:40px;margin-bottom:12px;">📡</div>' +
        '<h2 style="color:#182642;font-size:18px;margin-bottom:8px;">O app demorou pra carregar</h2>' +
        '<p style="color:#626B7A;font-size:14px;margin-bottom:20px;">Verifique sua conexão com a internet e tente novamente.</p>' +
        '<button onclick="location.reload()" style="padding:12px 24px;background:#1E5FA8;color:#fff;border:none;border-radius:10px;font-weight:700;font-size:14px;">TENTAR DE NOVO</button>' +
        '</div></div>';
    }
  }, 9000);
</script>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
